<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Match — PuzzleHub</title>
  <link rel="stylesheet" href="../../css/style.css">
  <link rel="stylesheet" href="memory.css">
</head>
<body>
  <header class="site-header">
    <h1><a class="back-link" href="../../index.html">PuzzleHub</a> / Memory Match</h1>
    <p class="tagline">Flip cards and find every matching pair.</p>
  </header>

  <main class="memory-app">
    <div class="memory-toolbar">
      <p id="memory-moves" class="memory-stat">Moves: 0</p>
      <p id="memory-timer" class="memory-stat">Time: 0s</p>
      <button id="memory-restart" class="wordle-key" type="button">Restart</button>
    </div>
    <div id="memory-grid" class="memory-grid" role="grid" aria-label="Memory Match board"></div>
    <p id="memory-message" class="wordle-message" role="status" aria-live="polite"></p>
  </main>

  <footer class="site-footer">
    <p>Built for the IS Project 2026</p>
  </footer>

  <script src="../../js/scoreboard.js"></script>
  <script src="memory.js"></script>
  <script src="memory-ui.js"></script>
</body>
</html>
